name: Threads Performance Snapshots

on:
  workflow_dispatch:
  schedule:
    # Two opportunities inside each six-hour capture window without running a
    # full account/post sync or increasing the existing sync cadence.
    - cron: "9 */3 * * *"

concurrency:
  group: threads-performance-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Capture due Threads insights
        run: npm run capture:performance
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
