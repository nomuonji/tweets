name: Performance Learning Validation

on:
  push:
    branches:
      - main
      - feat/threads-72h-performance-learning
      - feat/batch-opencode-draft-refill
    paths:
      - ".github/workflows/performance-learning-validation.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/analyze-patterns.ts"
      - "scripts/analyze-legacy-cohorts.ts"
      - "scripts/test-performance-learning.ts"
      - "scripts/test-performance-cohorts.ts"
      - "src/lib/performance-cohorts.ts"
      - "scripts/test-generation-fallback.ts"
      - "scripts/auto-generate-drafts.ts"
      - "src/lib/ai/generation-client.ts"
      - "scripts/test-generation-fallback.ts"
      - "scripts/auto-generate-drafts.ts"
      - "src/lib/ai/generation-client.ts"
      - "src/app/api/gemini/generate/route.ts"
      - "src/app/api/gemini/prepare-prompt/route.ts"
      - "src/app/api/gemini/simulate/route.ts"
      - "src/lib/account-gates.ts"
      - "src/lib/gemini/prompt.ts"
      - "src/lib/pattern.ts"
      - "src/lib/performance-snapshots.ts"
      - "src/lib/services/generation-brief-service.ts"
      - "src/lib/services/insight-service.ts"
      - "src/lib/services/prompt-service.ts"
      - "src/lib/services/sync-service.ts"
      - "src/lib/types.ts"
      - "scripts/test-threads-topic-tag.ts"
      - "src/lib/threads-topic-tag.ts"
      - "src/lib/platforms/threads.ts"
      - "src/lib/services/scheduler-service.ts"
      - "src/lib/services/draft-service.ts"
      - "src/lib/services/external-discovery-service.ts"
      - "src/lib/gemini/parser.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/performance-learning-validation.yml"
      - ".github/workflows/performance-snapshots.yml"
      - ".env.example"
      - "README.md"
      - "scripts/capture-performance-snapshots.ts"
      - "scripts/test-threads-insights.ts"
      - "src/app/api/oauth/[platform]/authorize/route.ts"
      - "src/app/api/oauth/[platform]/callback/route.ts"
      - "src/app/accounts/[platform]/oauth/page.tsx"
      - "src/components/accounts/manual-account-form.tsx"
      - "src/lib/oauth/threads-scopes.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/analyze-patterns.ts"
      - "scripts/test-performance-learning.ts"
      - "scripts/analyze-legacy-cohorts.ts"
      - "scripts/test-performance-cohorts.ts"
      - "src/lib/performance-cohorts.ts"
      - "src/app/api/gemini/generate/route.ts"
      - "src/app/api/gemini/prepare-prompt/route.ts"
      - "src/app/api/gemini/simulate/route.ts"
      - "src/lib/account-gates.ts"
      - "src/lib/gemini/prompt.ts"
      - "src/lib/pattern.ts"
      - "src/lib/performance-snapshots.ts"
      - "src/lib/services/generation-brief-service.ts"
      - "src/lib/services/insight-service.ts"
      - "src/lib/services/prompt-service.ts"
      - "src/lib/services/sync-service.ts"
      - "src/lib/types.ts"
      - "scripts/test-threads-topic-tag.ts"
      - "src/lib/threads-topic-tag.ts"
      - "src/lib/platforms/threads.ts"
      - "src/lib/services/scheduler-service.ts"
      - "src/lib/services/draft-service.ts"
      - "src/lib/services/external-discovery-service.ts"
      - "src/lib/gemini/parser.ts"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Performance learning regression tests
        run: npm run test:performance-learning

      - name: Age-matched performance cohort tests
        run: npm run test:performance-cohorts

      - name: Batch generation and provider fallback tests
        run: npm run test:generation-fallback

      - name: Threads Insights parser and OAuth scope tests
        run: npm run test:threads-insights

      - name: Threads topic-tag regression tests
        run: npm run test:threads-topic-tag

      - name: TypeScript typecheck
        run: npx tsc --noEmit
