name: External Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: unified-external-discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unified external discovery
        run: npm run sync:discovery
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          # One shared hard ceiling across every acquisition lane.
          RAPIDAPI_MONTHLY_BUDGET: "800"
          # Account sources: one query per account per 48h, rotated fairly.
          DISCOVERY_CACHE_HOURS: "48"
          DISCOVERY_MAX_SOURCES_PER_ACCOUNT: "1"
