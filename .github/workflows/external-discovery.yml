name: External Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Sync external winning posts
        run: npm run sync:external
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          # Quota policy. The free BASIC plan is 1,000 requests/month (hard
          # limit), so this spends roughly 30% and leaves headroom for retries.
          DISCOVERY_CACHE_HOURS: "48"             # refresh each source every 2 days
          DISCOVERY_MAX_SOURCES_PER_ACCOUNT: "2"  # rotate the stored keywords
          RAPIDAPI_MONTHLY_BUDGET: "800"          # stop before the 1,000 ceiling
