name: Pattern Analysis

on:
  workflow_dispatch:
  # Run a bounded Threads-only pattern pass when its implementation changes.
  # The regular weekly run below retains its existing full behavior.
  push:
    branches: [main]
    paths:
      - ".github/workflows/pattern-analysis.yml"
      - "scripts/analyze-patterns.ts"
      - "src/lib/pattern.ts"
      - "src/lib/character-version.ts"
  schedule:
    - cron: "30 1 * * 0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Analyze post patterns
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run analyze:patterns -- --no-insights --threads-only
          else
            npm run analyze:patterns
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
